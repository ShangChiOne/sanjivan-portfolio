<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastIQ — Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg:          #060810;
            --surface:     #0b0d17;
            --surface-2:   #10131f;
            --border:      rgba(255,255,255,0.07);
            --accent:      #00e5b0;
            --accent-dim:  rgba(0,229,176,0.08);
            --accent-glow: rgba(0,229,176,0.25);
            --purple:      #7c6aff;
            --text:        #e0e8f5;
            --text-soft:   #a0aec0;
            --text-muted:  #6b7d9e;
            --danger:      #ff4d6a;
            --danger-dim:  rgba(255,77,106,0.09);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle, rgba(255,255,255,0.022) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px;
        }

        @keyframes orb1 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(40px,-60px) scale(1.08); }
        }
        @keyframes orb2 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(-40px,50px) scale(1.1); }
        }
        .orb { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; }
        .orb-1 {
            top: -300px; right: -300px; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(0,229,176,0.09) 0%, transparent 65%);
            animation: orb1 20s ease-in-out infinite;
        }
        .orb-2 {
            bottom: -300px; left: -300px; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(124,106,255,0.09) 0%, transparent 65%);
            animation: orb2 26s ease-in-out infinite;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-wrap {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            animation: fadeUp .55s cubic-bezier(.16,1,.3,1) both;
        }

        .brand {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 32px; text-decoration: none;
        }
        .brand-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, rgba(0,229,176,0.2), rgba(124,106,255,0.12));
            border: 1px solid rgba(0,229,176,0.3);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 1.2rem;
            box-shadow: 0 0 24px rgba(0,229,176,0.2);
        }
        .brand-name {
            font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800;
            letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent), #00c8ff, var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .card {
            background: linear-gradient(155deg, var(--surface) 0%, rgba(8,10,18,0.97) 100%);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 36px 32px;
            box-shadow: 0 8px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.045);
        }

        .card-title {
            font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800;
            color: var(--text); margin-bottom: 6px;
        }
        .card-sub {
            font-size: .85rem; color: var(--text-soft); margin-bottom: 28px;
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: .7rem; font-weight: 600;
            letter-spacing: 1.6px; text-transform: uppercase;
            color: var(--text); margin-bottom: 8px;
        }
        .field input {
            width: 100%; background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text); border-radius: 10px; padding: 11px 14px;
            font-size: .9rem; font-family: 'Outfit', sans-serif;
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,229,176,0.1), 0 0 16px rgba(0,229,176,0.08);
        }
        .field input::placeholder { color: var(--text-muted); }
        .field-hint {
            font-size: .73rem; color: var(--text-muted); margin-top: 5px;
        }

        .alert-error {
            background: var(--danger-dim); border: 1px solid rgba(255,77,106,.22);
            border-radius: 10px; padding: 12px 14px; color: #ff8096;
            font-size: .84rem; margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px;
        }

        @keyframes btn-shimmer {
            0%   { left: -65%; }
            100% { left: 135%; }
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #00ccaa 100%);
            color: #060810; font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: .92rem;
            border: none; padding: 12px; border-radius: 11px;
            cursor: pointer; margin-top: 8px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative; overflow: hidden; isolation: isolate;
            transition: box-shadow .3s, transform .2s;
        }
        .btn-submit::before {
            content: '';
            position: absolute; top: 0; width: 45%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
            left: -65%; animation: btn-shimmer 2.6s ease-in-out infinite;
            pointer-events: none;
        }
        .btn-submit:hover {
            box-shadow: 0 0 34px var(--accent-glow), 0 0 68px rgba(0,229,176,0.1);
            transform: translateY(-2px);
        }
        .btn-submit:active { transform: translateY(0); }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
            margin: 24px 0;
        }

        .switch-link {
            text-align: center; font-size: .85rem; color: var(--text-soft);
        }
        .switch-link a {
            color: var(--accent); text-decoration: none; font-weight: 600;
            transition: opacity .2s;
        }
        .switch-link a:hover { opacity: .75; }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-wrap">

    <a class="brand" href="/login">
        <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5"/>
            </svg>
        </div>
        <span class="brand-name">ForecastIQ</span>
    </a>

    <div class="card">
        <div class="card-title">Create your account</div>
        <div class="card-sub">Start reducing food waste with AI-powered forecasting</div>

        {% if error %}
        <div class="alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="field">
                <label for="restaurant_name">Restaurant name</label>
                <input type="text" id="restaurant_name" name="restaurant_name"
                       placeholder="e.g. Nasi Kandar Sentral"
                       required autocomplete="organization">
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@restaurant.com"
                       required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required autocomplete="new-password">
                <div class="field-hint">Minimum 8 characters</div>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="••••••••" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">
                <i class="bi bi-person-plus-fill"></i>Create Account
            </button>
        </form>

        <div class="divider"></div>

        <div class="switch-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

</div>

</body>
</html>
